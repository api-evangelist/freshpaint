gaps:
- >-
  No vulnerability disclosure or bug bounty program is named anywhere on the
  trust center, and no security contact email is published. /.well-known/
  security.txt returns 404 on freshpaint.io, www.freshpaint.io and
  trust.freshpaint.io, and /security, /responsible-disclosure,
  /security/responsible-disclosure and /vulnerability-disclosure all return 404
  on www.freshpaint.io. A researcher who finds a bug in a HIPAA-scoped platform
  has no published route to report it. No Security or VulnerabilityDisclosure
  pointer is wired, because there is nothing to point at.
