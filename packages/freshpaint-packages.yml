method: searched
source: >-
  Registry metadata endpoints (registry.npmjs.org, repo1.maven.org,
  trunk.cocoapods.org) plus the first-party GitHub org github.com/freshpaint-io.
  PyPI, RubyGems, Packagist and crates.io were probed and returned no
  Freshpaint client library.
description: >-
  Freshpaint ships client SDKs for the four collection surfaces it supports:
  a browser snippet distributed from its own CDN, an Android library on Maven
  Central, an iOS library on CocoaPods/SwiftPM, and a React Native package on
  npm. There is no server-side SDK in any language — backends are expected to
  POST directly to the HTTP Events API at https://api.perfalytics.com/track.
