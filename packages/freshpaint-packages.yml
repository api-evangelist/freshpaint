  install: implementation 'io.freshpaint.android:freshpaint:2.0.5'
  official: true
  source_code: https://github.com/freshpaint-io/freshpaint-android
  version: 2.0.5
  published: '2025-08-18'
  note: >-
    Maven Central's newest release is 2.0.5 (2025-08-18). The GitHub repo has
    shipped 2.1.0 — gradle.properties reads VERSION_NAME=2.1.0 and CHANGELOG.md
    dates it 20 May 2026 — but 2.1.0 has not been published to Maven Central.
    The 2.1.0 upgrade note in that changelog also instructs consumers to depend
