scope: sdk
description: >-
  Freshpaint publishes NO changelog for the platform or the HTTP Events API on
  any public surface — www.freshpaint.io/changelog and
  www.freshpaint.io/product-updates both 404, and any release notes inside the
  docs site sit behind app.freshpaint.io/docs-login. What IS public and dated
  is the changelog kept in each first-party mobile SDK repo. Those are captured
  here; they are the only dated, structured change record Freshpaint publishes
  openly, and they do describe consumer-visible payload changes that affect
  what arrives at destinations.
